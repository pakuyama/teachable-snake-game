<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모션 뱀게임</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #22c55e; --food: #ef4444; --grid: #1a2436;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 16px;
  }
  h1 { margin: 8px 0 16px; font-size: 1.6rem; }
  .wrap { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .card { background: var(--panel); border-radius: 12px; padding: 16px; }
  #game { display: block; background: var(--grid); border-radius: 8px; max-width: 100%; }
  .info { display: flex; justify-content: space-between; margin-top: 10px; font-size: 1.1rem; }
  .side { width: 300px; max-width: 100%; }
  #webcam-container canvas { width: 100%; border-radius: 8px; display: block; }
  #webcam-container { min-height: 100px; background: #000; border-radius: 8px; margin-bottom: 12px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 0.9rem; }
  .bar-row span.name { width: 64px; }
  .bar { flex: 1; height: 14px; background: #334155; border-radius: 7px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .1s; }
  .bar-row.active span.name { color: var(--accent); font-weight: bold; }
  .val { width: 40px; text-align: right; color: var(--muted); }
  button {
    width: 100%; padding: 12px; font-size: 1rem; border: 0; border-radius: 8px;
    background: var(--accent); color: #052e16; font-weight: bold; cursor: pointer; margin-top: 8px;
  }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: var(--muted); font-size: .9rem; margin-top: 8px; min-height: 1.2em; }
  #dir { font-size: 2rem; text-align: center; margin: 8px 0; }
  label { font-size: .85rem; color: var(--muted); display: block; margin-top: 10px; }
  input[type=range] { width: 100%; }
</style>
</head>
<body>
<h1>🐍 웹캠 모션 뱀게임</h1>
<div class="wrap">
  <div class="card">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="info">
      <div>점수: <b id="score">0</b></div>
      <div>최고: <b id="best">0</b></div>
    </div>
  </div>

  <div class="card side">
    <div id="webcam-container"></div>
    <div id="dir">⏸</div>
    <div id="bars"></div>

    <label>인식 임계값: <b id="thVal">0.80</b></label>
    <input type="range" id="threshold" min="0.5" max="0.99" step="0.01" value="0.8">
    <label>속도 (ms/칸): <b id="spVal">200</b></label>
    <input type="range" id="speed" min="80" max="400" step="10" value="200">

    <button id="startCam">📷 웹캠 & 모델 시작</button>
    <button id="startGame" disabled>▶ 게임 시작</button>
    <div id="status">키보드 방향키로도 조작할 수 있어요.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<script>
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/U93WCxIU8/";

// ---------- 게임 ----------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const CELLS = 20;
const SIZE = canvas.width / CELLS;
const DIRS = {
  up:    { x: 0,  y: -1, icon: "⬆️" },
  down:  { x: 0,  y: 1,  icon: "⬇️" },
  left:  { x: -1, y: 0,  icon: "⬅️" },
  right: { x: 1,  y: 0,  icon: "➡️" },
};

let snake, dir, nextDir, food, score, running = false, timer = null;
let best = Number(localStorageGet("snakeBest") || 0);
document.getElementById("best").textContent = best;

function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

function resetGame() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = "right"; nextDir = "right"; score = 0;
  document.getElementById("score").textContent = 0;
  placeFood();
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function isOpposite(a, b) {
  return DIRS[a].x + DIRS[b].x === 0 && DIRS[a].y + DIRS[b].y === 0;
}

function setDirection(d) {
  if (!DIRS[d]) return;
  // 현재 진행 방향의 반대쪽으로는 바로 꺾을 수 없음
  if (!isOpposite(d, dir)) nextDir = d;
}

function step() {
  dir = nextDir;
  const head = { x: snake[0].x + DIRS[dir].x, y: snake[0].y + DIRS[dir].y };

  if (head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById("score").textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
  timer = setTimeout(step, Number(speedEl.value));
}

function draw() {
  ctx.fillStyle = "#1a2436";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "#223049";
  for (let i = 0; i <= CELLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * SIZE, 0); ctx.lineTo(i * SIZE, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * SIZE); ctx.lineTo(canvas.width, i * SIZE); ctx.stroke();
  }
  ctx.fillStyle = "#ef4444";
  ctx.beginPath();
  ctx.arc(food.x * SIZE + SIZE / 2, food.y * SIZE + SIZE / 2, SIZE / 2 - 3, 0, Math.PI * 2);
  ctx.fill();
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? "#86efac" : "#22c55e";
    ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2);
  });
}

function drawMessage(msg, sub) {
  ctx.fillStyle = "rgba(0,0,0,.6)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.font = "bold 36px 'Malgun Gothic', sans-serif";
  ctx.fillText(msg, canvas.width / 2, canvas.height / 2 - 10);
  if (sub) {
    ctx.font = "18px 'Malgun Gothic', sans-serif";
    ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 26);
  }
}

function startGame() {
  clearTimeout(timer);
  resetGame();
  running = true;
  draw();
  timer = setTimeout(step, Number(speedEl.value));
}

function gameOver() {
  running = false;
  if (score > best) {
    best = score;
    localStorageSet("snakeBest", best);
    document.getElementById("best").textContent = best;
  }
  drawMessage("GAME OVER", `점수 ${score} · 스페이스바 또는 버튼으로 재시작`);
}

// 키보드 조작 (보조)
document.addEventListener("keydown", e => {
  const map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
  if (map[e.key]) { e.preventDefault(); setDirection(map[e.key]); }
  if (e.code === "Space" && !running) { e.preventDefault(); startGame(); }
});

// ---------- 티처블머신 ----------
let model, webcam, labels = [];
const bars = document.getElementById("bars");
const statusEl = document.getElementById("status");
const dirEl = document.getElementById("dir");
const thEl = document.getElementById("threshold");
const speedEl = document.getElementById("speed");
thEl.oninput = () => document.getElementById("thVal").textContent = Number(thEl.value).toFixed(2);
speedEl.oninput = () => document.getElementById("spVal").textContent = speedEl.value;

async function initModel() {
  const btn = document.getElementById("startCam");
  btn.disabled = true;
  statusEl.textContent = "모델 불러오는 중...";
  try {
    model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
    labels = model.getClassLabels();

    bars.innerHTML = labels.map((l, i) => `
      <div class="bar-row" id="row${i}">
        <span class="name">${l}</span>
        <div class="bar"><div id="bar${i}"></div></div>
        <span class="val" id="val${i}">0</span>
      </div>`).join("");

    statusEl.textContent = "웹캠 켜는 중...";
    webcam = new tmImage.Webcam(240, 240, true); // 좌우 반전 (거울 모드)
    await webcam.setup();
    await webcam.play();
    document.getElementById("webcam-container").appendChild(webcam.canvas);

    statusEl.textContent = "준비 완료! 게임을 시작하세요.";
    btn.textContent = "✅ 웹캠 실행 중";
    document.getElementById("startGame").disabled = false;
    window.requestAnimationFrame(loop);
  } catch (err) {
    console.error(err);
    statusEl.textContent = "오류: " + err.message + " (웹캠 권한/인터넷 연결 확인)";
    btn.disabled = false;
  }
}

let predicting = false;
async function loop() {
  webcam.update();
  if (!predicting) {
    predicting = true;
    await predict();
    predicting = false;
  }
  window.requestAnimationFrame(loop);
}

async function predict() {
  const preds = await model.predict(webcam.canvas);
  let top = preds[0], topIdx = 0;
  preds.forEach((p, i) => {
    document.getElementById("bar" + i).style.width = (p.probability * 100) + "%";
    document.getElementById("val" + i).textContent = Math.round(p.probability * 100);
    document.getElementById("row" + i).classList.remove("active");
    if (p.probability > top.probability) { top = p; topIdx = i; }
  });
  document.getElementById("row" + topIdx).classList.add("active");

  const cls = top.className.trim().toLowerCase();
  if (top.probability >= Number(thEl.value)) {
    if (DIRS[cls]) {
      dirEl.textContent = DIRS[cls].icon;
      if (running) setDirection(cls);
    } else {
      dirEl.textContent = "⏺"; // neutral: 현재 방향 유지
    }
  }
}

document.getElementById("startCam").onclick = initModel;
document.getElementById("startGame").onclick = startGame;

resetGame();
draw();
drawMessage("모션 뱀게임", "웹캠을 켜고 게임을 시작하세요");
</script>
</body>
</html>
